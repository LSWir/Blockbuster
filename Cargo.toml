[package]
name = "blockbuster"
version = "0.4.10"
edition = "2021"
description = "Blockbuster"
build = "build.rs"

[lib]
name = "blockbuster"
path = "src/lib.rs"

[[bin]]
name = "Blockbuster"
path = "src/main.rs"

[dependencies]
slint = "1.9"
serde_json = "1"
fancy-regex = "0.13"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = "1"
base64 = "0.22"
roxmltree = "0.20"
md5 = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rfd = "0.15"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
